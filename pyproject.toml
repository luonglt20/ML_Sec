[project]
name = "final-luong"
version = "0.1.0"
description = "Standalone MedQA prompt-injection attack and defense evaluation (V0-V4)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]
ui = ["streamlit>=1.28"]
rag = ["transformers>=4.30", "torch>=2.0", "numpy>=1.25"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["medqa_multiagent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project]
name = "medqa-multiagent"
version = "0.1.0"
description = "MedQA-USMLE multi-agent evaluation harness (V0-V4 variant ladder)."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]
ui = ["streamlit>=1.28"]
rag = ["faiss-cpu>=1.7", "transformers>=4.30", "torch>=2.0", "numpy>=1.25"]
security = [
  "transformers>=4.40",
  "torch>=2.0",
  "accelerate>=0.28",
  "bitsandbytes>=0.43; platform_system != 'Darwin'",
]

[project.scripts]
medqa-multiagent = "medqa_multiagent.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["medqa_multiagent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
